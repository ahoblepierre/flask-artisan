[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-artisan"
dynamic = ["version"]
description = "Les conventions de Laravel pour Flask : conteneur, routage, ORM façon Eloquent, auth et commandes make:*."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["flask>=3.0", "python-dotenv>=1.0", "sqlalchemy>=2.0", "alembic>=1.13"]
keywords = ["flask", "laravel", "framework", "orm", "artisan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
pgsql = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
flask-artisan = "flask_artisan.cli:main"

[project.urls]
Homepage = "https://github.com/ahoblepierre/flask-artisan"
Issues = "https://github.com/ahoblepierre/flask-artisan/issues"
Changelog = "https://github.com/ahoblepierre/flask-artisan/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "flask_artisan.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["flask_artisan", "flask_artisan.database", "flask_artisan.auth"]

[tool.setuptools.package-data]
flask_artisan = [
    "skeleton/**/*",
    "skeleton/.env.example",
    "skeleton/.gitignore",
    "skeleton/database/.gitignore",
    "skeleton/database/migrations/.gitkeep",
    "stubs/*",
]
"flask_artisan.database" = ["alembic_env/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # ruff formate aussi les blocs de code Markdown : docs hors périmètre

[tool.ruff.lint.per-file-ignores]
# Kernels HTTP : listes et dicts en attributs de classe, par convention (comme Laravel).
"**/kernel.py" = ["RUF012"]
"**/models/*.py" = ["RUF012"]  # fillable, hidden : listes en attributs de classe (Eloquent)
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
